<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이동윤 (Dong-Yun Lee)</title>
<meta name="description" content="이동윤 — 부산대학교 사학과 / 인문사회융합인재양성사업단. 한국고대사, 신라사.">
<meta property="og:title" content="이동윤 (Dong-Yun Lee)">
<meta property="og:type" content="website">
<meta property="og:url" content="https://leedongyun.com/">
<meta property="og:image" content="https://leedongyun.com/images/profile.jpg">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="images/favicon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/apple-touch-icon-180x180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- Pretendard에는 한자가 없어, 한자 글리프만 본고딕(Noto Sans KR, OFL)으로 채운다. 쓰인 글자 범위만 내려받음 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --mute:#59636e; --line:#d1d9e0; --soft:#f6f8fa; --link:#0969da; --chip:#eff2f5;
  /* 주제어 구름 4단계(1편 / 2 / 3–4 / 5+) — 본문 글자색과 같은 회청(슬레이트) 계열, 라이트·다크 모두 4.5:1 이상 */
  --k1:#5c6f8a; --k2:#435470; --k3:#2b3a52; --k4:#16233a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard Variable",Pretendard,"Noto Sans KR",Helvetica,Arial,sans-serif;
  --kf:"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0d1117;--fg:#e6edf3;--mute:#8d96a0;--line:#30363d;--soft:#161b22;--link:#4493f8;--chip:#21262d;
    --k1:#8b9bb4;--k2:#a6b3c8;--k3:#c2ccdb;--k4:#dfe5ee}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}

header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
header .in{max-width:1012px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;gap:24px}
header .n{font-weight:600;color:var(--fg);margin-right:auto}
header nav a{color:var(--fg);font-size:14px;margin-left:18px}
header nav a:hover{color:var(--link);text-decoration:none}

.page{max-width:1012px;margin:0 auto;padding:32px 24px 80px;display:grid;grid-template-columns:256px 1fr;gap:40px}
main{min-width:0}

.prof img{width:100%;max-width:256px;aspect-ratio:4/5;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block}
.prof h1{font-size:24px;font-weight:600;margin:16px 0 0;line-height:1.25}
.prof .en{font-size:18px;color:var(--mute);font-weight:300;margin:0}
.prof .bio{margin:14px 0 0;font-size:15px}
.prof ul{list-style:none;padding:0;margin:16px 0 0;font-size:14px;color:var(--mute)}
.prof li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.prof li svg{width:16px;height:16px;flex:none;fill:currentColor;margin-top:3px}
.prof li a{color:var(--fg)}
.sticky{position:sticky;top:72px}

main h2{font-size:20px;font-weight:600;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
main section{margin-bottom:40px}
main p{margin:0 0 12px}
.kw{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.kw li{background:var(--chip);border-radius:2em;padding:2px 10px;font-size:13px}

.list{margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:132px 1fr;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .d{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.list .s{color:var(--mute);font-size:14px;display:block}

.pub{padding:12px 0;border-bottom:1px solid var(--line)}
.pub:last-child{border-bottom:0}
.pub .t{font-weight:600}
.pub .t a{color:var(--fg)}
.pub .en{color:var(--mute);font-size:14px}
.pub .m{color:var(--mute);font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pub .m b{font-weight:500;color:var(--fg)}
.pub .m .tag{font-family:var(--mono);font-size:11px;background:var(--chip);padding:1px 6px;border-radius:4px}
.pub .kws{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pub .kws button{font:inherit;font-family:var(--kf);font-size:12px;line-height:1.4;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:2em;padding:1px 9px;cursor:pointer}
.pub .kws button:hover{color:var(--fg);border-color:var(--mute)}
.pub .kws button.on{color:var(--bg);background:var(--link);border-color:var(--link)}
.filt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 6px;font-size:14px}
.filt b{font-weight:600;font-family:var(--kf)}
.filt .n{color:var(--mute);font-size:13px}
.filt .x{margin-left:auto;font:inherit;font-size:13px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 10px;color:var(--fg);cursor:pointer}
.filt .x:hover{border-color:var(--mute)}
.pubs.filtering .yr{display:none}
.pubs.filtering .pub:not(.hit){display:none}
.pubs.filtering .btn{display:none}

/* 주제어 구름 */
.kc{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.kc svg{display:block;width:100%;height:auto;font-family:var(--kf)}
.kc text{cursor:pointer;transition:opacity .15s}
.kc text.c1{fill:var(--k1)} .kc text.c2{fill:var(--k2)} .kc text.c3{fill:var(--k3)} .kc text.c4{fill:var(--k4)}
.kc text:hover,.kc text:focus{text-decoration:underline;text-underline-offset:.12em;outline:none}
.kc.hl text:not(.on){opacity:.18}
.kc text.sel{text-decoration:underline;text-underline-offset:.12em}
.kc .tip{position:absolute;z-index:3;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.12);pointer-events:none;max-width:300px}
.kc .tip b{font-weight:600;font-family:var(--kf)}
.kc .tip .e{color:var(--mute);font-size:12px}
.kc .lg{position:absolute;right:10px;bottom:8px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mute);pointer-events:none;font-family:var(--mono)}
.kc .lg i{display:inline-block;width:8px;height:8px;border-radius:2px}
.kc-alt{margin:8px 0 0;font-size:12.5px;color:var(--mute)}
.kc-alt button{font:inherit;font-size:12.5px;color:var(--link);background:none;border:0;padding:0;cursor:pointer}
.kc-alt button:hover{text-decoration:underline}
.kc-list{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.kc-list li button{font:inherit;font-family:var(--kf);font-size:12.5px;background:var(--chip);border:1px solid transparent;border-radius:2em;padding:2px 10px;color:var(--fg);cursor:pointer}
.kc-list li button:hover{border-color:var(--mute)}
.kc-list li button b{font-weight:500;color:var(--mute);margin-left:4px;font-family:var(--mono);font-size:11px}
.yr{font-family:var(--mono);font-size:12px;color:var(--mute);margin:18px 0 0;letter-spacing:.04em}
.yr:first-child{margin-top:0}
.btn{display:inline-block;margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 14px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--mute)}
[hidden]{display:none!important}
.btn .c{display:none}.btn[aria-expanded=true] .o{display:none}.btn[aria-expanded=true] .c{display:inline}

footer{border-top:1px solid var(--line);color:var(--mute);font-size:12.5px}
footer .in{max-width:1012px;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media(max-width:768px){
  .page{grid-template-columns:1fr;gap:24px;padding-top:24px}
  .prof{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
  .prof img{max-width:96px;border-radius:8px}.prof h1{margin-top:0;font-size:20px}.prof .en{font-size:15px}
  .prof .bio,.prof ul{grid-column:1/-1;margin-top:4px}
  .sticky{position:static}header nav{display:none}
  .list li{grid-template-columns:1fr;gap:2px}
  .kc .lg{display:none}
}
</style>
</head>
<body>

<header><div class="in">
  <a class="n" href="#" id="hdr-name">Dong-Yun Lee</a>
  <nav><a href="#about">About</a><a href="#keywords">Keywords</a><a href="#education">Education</a><a href="#positions">Positions</a><a href="#publications">Publications</a><a href="#presentations">Presentations</a><a href="#contact">Contact</a></nav>
</div></header>

<div class="page">
  <aside><div class="sticky prof" id="prof"></div></aside>
  <main id="main"></main>
</div>

<footer><div class="in"><span id="foot-l"></span><span id="foot-r"></span></div></footer>

<script>
(function(){
  var ICON={
    mail:'<svg viewBox="0 0 16 16"><path d="M1.75 2A1.75 1.75 0 0 0 0 3.75v8.5C0 13.216.784 14 1.75 14h12.5A1.75 1.75 0 0 0 16 12.25v-8.5A1.75 1.75 0 0 0 14.25 2ZM1.5 12.25v-6l6.5 3.9 6.5-3.9v6a.25.25 0 0 1-.25.25H1.75a.25.25 0 0 1-.25-.25Zm13-7.75L8 8.4 1.5 4.5v-.75a.25.25 0 0 1 .25-.25h12.5a.25.25 0 0 1 .25.25Z"/></svg>',
    org:'<svg viewBox="0 0 16 16"><path d="M1.5 14.25c0 .138.112.25.25.25H4v-1.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 .75.75v1.25h2.25a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25ZM1.75 16A1.75 1.75 0 0 1 0 14.25V1.75C0 .784.784 0 1.75 0h8.5C11.216 0 12 .784 12 1.75v12.5c0 .085-.006.168-.018.25h2.268a.25.25 0 0 0 .25-.25V8.285a.25.25 0 0 0-.111-.208l-1.055-.703a.749.749 0 1 1 .832-1.248l1.055.703c.487.325.779.871.779 1.456v5.965A1.75 1.75 0 0 1 14.25 16h-3.5a.766.766 0 0 1-.197-.026c-.099.017-.2.026-.303.026h-3a.75.75 0 0 1-.75-.75V14h-1v1.25a.75.75 0 0 1-.75.75Zm1.75-11.5a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1-.75-.75ZM3.5 7a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 3.5 7Zm3-3.25a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1-.75-.75ZM6.5 7a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 6.5 7Z"/></svg>',
    pin:'<svg viewBox="0 0 16 16"><path d="m12.596 11.596-3.535 3.536a1.5 1.5 0 0 1-2.122 0l-3.535-3.536a6.5 6.5 0 1 1 9.192-9.193 6.5 6.5 0 0 1 0 9.193Zm-1.06-8.132v-.001a5 5 0 1 0-7.072 7.072L8 14.07l3.536-3.534a5 5 0 0 0 0-7.072ZM8 9a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 9Z"/></svg>',
    gh:'<svg viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>',
    link:'<svg viewBox="0 0 16 16"><path d="M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 .75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"/></svg>'
  };
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* ---------- 주제어 구름 (라이브러리 없음) ----------
     words: [{t:주제어, c:논문 수, en:영문}] — 크기는 논문 수, 배치는 나선형 충돌 회피, 매번 같은 모양 */
  var KF='"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif';
  function seeded(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
  function buildCloud(host,words,onPick){
    var W=host.clientWidth||668, narrow=W<520, H=narrow?380:290, scale=narrow?.86:1;
    var max=Math.max.apply(null,words.map(function(w){return w.c}));
    var ctx=document.createElement('canvas').getContext('2d');
    var rnd=seeded(7), placed=[], PAD=4;
    words.forEach(function(w){
      var fs=Math.round((13+(max>1?(w.c-1)/(max-1):0)*33)*scale);
      var fw=w.c>=3?700:w.c>=2?600:500;
      ctx.font=fw+' '+fs+'px '+KF;
      var tw=ctx.measureText(w.t).width*1.04+2, th=fs*1.22;
      var a0=rnd()*Math.PI*2, ok=false;
      for(var i=0;i<3000&&!ok;i++){
        var t=i*.12, r=1.15*t;
        var x=W/2+r*Math.cos(t+a0)*1.75, y=H/2+r*Math.sin(t+a0)*.8;
        var bx=x-tw/2-PAD, by=y-th/2-PAD, bw=tw+PAD*2, bh=th+PAD*2;
        if(bx<4||by<4||bx+bw>W-4||by+bh>H-4)continue;
        var hit=false;
        for(var j=0;j<placed.length;j++){var p=placed[j];if(bx<p.x+p.w&&p.x<bx+bw&&by<p.y+p.h&&p.y<by+bh){hit=true;break}}
        if(!hit){placed.push({x:bx,y:by,w:bw,h:bh});w.x=x;w.y=y;w.fs=fs;w.fw=fw;ok=true}
      }
      w.ok=ok;
    });
    var h='<svg viewBox="0 0 '+W+' '+H+'" role="list" aria-label="논문 주제어">';
    words.forEach(function(w,i){if(!w.ok)return;
      var lv=w.c>=5?4:w.c>=3?3:w.c>=2?2:1;
      h+='<text role="listitem" tabindex="0" data-i="'+i+'" class="c'+lv+'" x="'+w.x.toFixed(1)+'" y="'+w.y.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="'+w.fs+'" font-weight="'+w.fw+'">'+esc(w.t)+'</text>';
    });
    h+='</svg><div class="tip" hidden></div><div class="lg"><i style="background:var(--k1)"></i>1편 <i style="background:var(--k2)"></i>2 <i style="background:var(--k3)"></i>3–4 <i style="background:var(--k4)"></i>5+</div>';
    host.innerHTML=h;
    var tip=host.querySelector('.tip');
    host.querySelectorAll('text').forEach(function(el){
      var w=words[+el.getAttribute('data-i')];
      el.addEventListener('mousemove',function(ev){
        tip.innerHTML='<b>'+esc(w.t)+'</b> · '+w.c+'편'+(w.en?'<div class="e">'+esc(w.en)+'</div>':'')+'<div class="e">누르면 관련 논문만 보기</div>';
        tip.hidden=false;
        var r=host.getBoundingClientRect(),x=ev.clientX-r.left+12,y=ev.clientY-r.top+14;
        if(x+tip.offsetWidth>host.clientWidth-6)x=x-tip.offsetWidth-24;
        if(y+tip.offsetHeight>host.clientHeight-6)y=y-tip.offsetHeight-24;
        tip.style.left=x+'px';tip.style.top=y+'px';
        host.classList.add('hl');el.classList.add('on');
      });
      el.addEventListener('mouseleave',function(){tip.hidden=true;host.classList.remove('hl');el.classList.remove('on')});
      el.addEventListener('click',function(){onPick(w.t)});
      el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();onPick(w.t)}});
    });
  }
  // 구름 상자의 너비가 바뀌면(창 크기, 모바일 회전 등) 다시 그린다
  var redrawCloud=null,rzTimer;
  function scheduleRedraw(){clearTimeout(rzTimer);rzTimer=setTimeout(function(){if(redrawCloud)redrawCloud()},150)}
  window.addEventListener('resize',scheduleRedraw);
  var cloudRO=window.ResizeObserver?new ResizeObserver(scheduleRedraw):null;

  function render(d){
    var p=d.profile||{};
    document.title=p.name+' ('+p.name_en+')';
    document.getElementById('hdr-name').textContent=p.name_en||p.name;

    var links=[];
    if(p.orcid)links.push('<a href="'+esc(p.orcid)+'">ORCID</a>');
    if(p.scholar)links.push('<a href="'+esc(p.scholar)+'">Google Scholar</a>');
    document.getElementById('prof').innerHTML=
      '<img src="'+esc(p.photo||'images/profile.jpg')+'" alt="">'+
      '<h1>'+esc(p.name)+'</h1><p class="en">'+esc(p.name_en)+'</p>'+
      (p.bio?'<p class="bio">'+esc(p.bio)+'</p>':'')+
      '<ul>'+
      (p.email?'<li>'+ICON.mail+'<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a></li>':'')+
      (p.affiliation?'<li>'+ICON.org+'<span>'+esc(p.affiliation)+'</span></li>':'')+
      (p.location?'<li>'+ICON.pin+'<span>'+esc(p.location)+'</span></li>':'')+
      (p.github?'<li>'+ICON.gh+'<a href="https://github.com/'+esc(p.github)+'">'+esc(p.github)+'</a></li>':'')+
      (links.length?'<li>'+ICON.link+'<span>'+links.join(' · ')+'</span></li>':'')+
      '</ul>';

    var pubs=(d.publications||[]).slice().sort(function(a,b){return (b.year-a.year)||((b.month||0)-(a.month||0))});
    // data.json의 show_keywords가 true일 때만 주제어 구름·칩·필터를 보여준다
    var showKw=d.show_keywords===true;
    pubs.forEach(function(q,i){q._i=i;q._kw=showKw?(q.keywords||[]).map(function(k){return String(k).trim()}).filter(Boolean):[]});
    var cnt={},enOf={};
    pubs.forEach(function(q){q._kw.forEach(function(k,j){cnt[k]=(cnt[k]||0)+1;var e=(q.keywords_en||[])[j];if(!enOf[k]&&e)enOf[k]=e})});
    var words=Object.keys(cnt).map(function(k){return {t:k,c:cnt[k],en:enOf[k]||''}}).sort(function(a,b){return b.c-a.c||a.t.localeCompare(b.t,'ko')});

    var h='';
    h+='<section id="about"><h2>About</h2>'+(d.about||[]).map(function(t){return '<p>'+esc(t)+'</p>'}).join('');
    if(d.interests&&d.interests.length)h+='<p style="margin-top:16px"><b style="font-weight:600">Research interests</b></p><ul class="kw">'+d.interests.map(function(k){return '<li>'+esc(k)+'</li>'}).join('')+'</ul>';
    h+='</section>';

    if(words.length){
      h+='<section id="keywords"><h2>Keywords</h2><div class="kc" id="kc"></div>'+
         '<div class="kc-alt"><button type="button" id="kc-toggle">목록으로 보기</button></div>'+
         '<ul class="kc-list" id="kc-list" hidden>'+words.map(function(w){return '<li><button type="button" data-k="'+esc(w.t)+'">'+esc(w.t)+'<b>'+w.c+'</b></button></li>'}).join('')+'</ul></section>';
    }
    var navK=document.querySelector('nav a[href="#keywords"]');if(navK)navK.hidden=!words.length;

    function list(id,title,items){
      if(!items||!items.length)return '';
      return '<section id="'+id+'"><h2>'+title+'</h2><ul class="list">'+items.map(function(e){
        return '<li><span class="d">'+esc(e.period)+'</span><span>'+esc(e.title)+(e.sub?'<span class="s">'+esc(String(e.sub).trim()).replace(/\n/g,'<br>')+'</span>':'')+'</span></li>'}).join('')+'</ul></section>';
    }
    h+=list('education','Education',d.education);
    h+=list('positions','Positions',d.positions);

    var vis=d.publications_visible||5, first=pubs.slice(0,vis), rest=pubs.slice(vis);
    function pubHtml(arr){
      var out='',y=null;
      arr.forEach(function(q){
        if(q.year!==y){y=q.year;out+='<div class="yr">'+esc(y)+'</div>'}
        var t=q.url?'<a href="'+esc(q.url)+'">'+esc(q.title)+'</a>':esc(q.title);
        var m=[];
        if(q.venue)m.push('<span><b>'+esc(q.venue)+'</b>'+(q.volume?' '+esc(q.volume):'')+(q.pages?', pp. '+esc(q.pages):'')+'</span>');
        if(q.type)m.push('<span class="tag">'+esc(q.type)+'</span>');
        if(q.pdf)m.push('<a href="'+esc(q.pdf)+'">PDF</a>');
        var kws=q._kw.length?'<div class="kws">'+q._kw.map(function(k){return '<button type="button" data-k="'+esc(k)+'">'+esc(k)+'</button>'}).join('')+'</div>':'';
        out+='<div class="pub" data-i="'+q._i+'"><div class="t">'+t+'</div>'+(q.title_en?'<div class="en">'+esc(q.title_en)+'</div>':'')+'<div class="m">'+m.join('')+'</div>'+kws+'</div>';
      });
      return out;
    }
    if(pubs.length){
      h+='<section id="publications"><h2>Publications</h2>';
      if(d.publications_note)h+='<p style="color:var(--mute);font-size:14px">'+esc(d.publications_note)+'</p>';
      h+='<div class="filt" id="filt" hidden></div><div class="pubs" id="pubs"><div>'+pubHtml(first)+'</div>';
      if(rest.length){
        var y0=rest[rest.length-1].year,y1=rest[0].year;
        h+='<button class="btn" aria-expanded="false"><span class="o">Show '+rest.length+' more ('+y0+(y1!==y0?'–'+y1:'')+')</span><span class="c">Show less</span></button><div hidden>'+pubHtml(rest)+'</div>';
      }
      h+='</div></section>';
    }
    h+=list('presentations','Presentations',d.presentations);
    var navP=document.querySelector('nav a[href="#presentations"]');if(navP)navP.hidden=!(d.presentations&&d.presentations.length);
    var c=d.contact||{};
    h+='<section id="contact"><h2>Contact</h2><p>'+(p.email?'<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a><br>':'')+esc(String(c.address||'').trim()).replace(/\n/g,'<br>')+'</p></section>';
    document.getElementById('main').innerHTML=h;

    document.getElementById('foot-l').textContent='© '+new Date().getFullYear()+' '+(p.name_en||p.name);
    document.getElementById('foot-r').innerHTML=(d.updated?'Last updated '+esc(d.updated)+' · ':'')+(p.github?'<a href="https://github.com/'+esc(p.github)+'/'+esc(p.github)+'.github.io">source</a>':'');

    var b=document.querySelector('.btn'),moreBox=b?b.nextElementSibling:null;
    if(b)b.addEventListener('click',function(){var on=moreBox.hasAttribute('hidden');if(on)moreBox.removeAttribute('hidden');else moreBox.setAttribute('hidden','');b.setAttribute('aria-expanded',on?'true':'false')});

    /* ---------- 주제어로 논문 거르기 ---------- */
    var pubsBox=document.getElementById('pubs'),filt=document.getElementById('filt'),active=null;
    function applyFilter(k,scroll){
      if(!pubsBox)return;
      active=k;
      var hits=0;
      pubsBox.querySelectorAll('.pub').forEach(function(el){var q=pubs[+el.getAttribute('data-i')];var hit=!!k&&q._kw.indexOf(k)>=0;el.classList.toggle('hit',hit);if(hit)hits++;
        el.querySelectorAll('.kws button').forEach(function(bt){bt.classList.toggle('on',!!k&&bt.getAttribute('data-k')===k)})});
      pubsBox.classList.toggle('filtering',!!k);
      if(k){
        if(moreBox)moreBox.removeAttribute('hidden');
        filt.innerHTML='<span>주제어 <b>'+esc(k)+'</b></span><span class="n">'+hits+'편</span><button type="button" class="x">전체 보기 ✕</button>';filt.hidden=false;
        filt.querySelector('.x').addEventListener('click',function(){applyFilter(null)});
        history.replaceState(null,'','#kw='+encodeURIComponent(k));
        if(scroll)document.getElementById('publications').scrollIntoView({behavior:'smooth'});
      }else{
        filt.hidden=true;
        if(moreBox){moreBox.setAttribute('hidden','');b.setAttribute('aria-expanded','false')}
        if(/^#kw=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
      }
      document.querySelectorAll('#kc text').forEach(function(el){el.classList.toggle('sel',!!k&&el.textContent===k)});
    }
    document.querySelectorAll('.kws button, #kc-list button').forEach(function(bt){bt.addEventListener('click',function(){var k=bt.getAttribute('data-k');var inList=!!bt.closest('.kws');applyFilter(active===k&&inList?null:k,!inList)})});
    var kc=document.getElementById('kc'),lst=document.getElementById('kc-list'),tg=document.getElementById('kc-toggle');
    if(kc){
      tg.addEventListener('click',function(){var on=lst.hasAttribute('hidden');if(on){lst.removeAttribute('hidden');kc.setAttribute('hidden','');tg.textContent='구름으로 보기'}else{lst.setAttribute('hidden','');kc.removeAttribute('hidden');tg.textContent='목록으로 보기'}});
      var allText=words.map(function(w){return w.t}).join(''),lastW=0;
      var draw=function(){
        if(kc.hidden||kc.clientWidth===lastW)return;lastW=kc.clientWidth;
        buildCloud(kc,words,function(k){applyFilter(k,true)});
        if(active)applyFilter(active,false);
      };
      redrawCloud=draw;
      if(cloudRO){cloudRO.disconnect();cloudRO.observe(kc)}
      var ready=(document.fonts&&document.fonts.load)?Promise.all([500,600,700].map(function(wt){return document.fonts.load(wt+' 20px "Noto Sans KR"',allText).catch(function(){})})).then(function(){return document.fonts.ready}):Promise.resolve();
      ready.then(draw);
      var m=/^#kw=(.+)$/.exec(location.hash);if(m){try{applyFilter(decodeURIComponent(m[1]),false)}catch(e){}}
    }else{redrawCloud=null}
  }

  fetch('data.json?'+Date.now()).then(function(r){return r.json()}).then(render).catch(function(e){document.getElementById('main').innerHTML='<p>data.json을 불러오지 못했습니다.</p>';console.error(e)});
  // 관리 페이지 미리보기용: postMessage로 데이터를 받으면 그걸로 다시 그린다
  window.addEventListener('message',function(ev){if(ev.data&&ev.data.type==='preview'&&ev.data.data)render(ev.data.data)});
})();
</script>
</body>
</html>
